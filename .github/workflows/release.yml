name: release
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Hydrate signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > /tmp/signing.keystore

      - name: Build signed release APK
        env:
          FNOX_PROFILE: ci
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
        run: mise run app:build-release

      - run: rm /tmp/signing.keystore

      - name: Upload APK as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} target/release/apk/fmbqtimer.apk
